name: 股指基差快照自动更新

# 数据源仍为新浪财经；Actions 在服务端带 Referer 抓取并生成静态 JSON。
# 前端每 60 秒读取一次快照，实现分钟级自动更新。

on:
  schedule:
    # UTC 1:00-7:59 = 北京时间 9:00-15:59，每 15 分钟一次（周一至周五）
    - cron: '*/15 1-7 * * 1-5'
    # UTC 8:00 = 北京时间 16:00，收盘后再生成一次
    - cron: '0 8 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: basis-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 生成基差快照
        run: node scripts/generate.js

      - name: 提交更新后的数据文件
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新股指基差快照"
            git push
          fi

      - name: 配置 Pages
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
